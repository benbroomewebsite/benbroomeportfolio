# The live site deploys from main. When a save in /keystatic lands on a branch
# made in the editor (named editor/… by branchPrefix in keystatic.config.ts),
# merge it into main so the change is published like any other save.
name: Publish editor branches

on:
  push:
    branches: ['editor/**']

permissions:
  contents: write

concurrency:
  group: publish-editor-branches
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/${GITHUB_REF_NAME}" -m "Publish editor changes from ${GITHUB_REF_NAME}"
          git push origin main
